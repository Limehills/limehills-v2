<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limehills | Scale Your Digital Peak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f0f4f8;
            color: #213e8d;
            scroll-behavior: smooth;
        }

        /* Parallax & Animation Keyframes */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes glow {

            0%,
            100% {
                box-shadow: 8px 8px 0px #1034a6;
            }

            50% {
                box-shadow: 12px 12px 0px #1034a6, 0 0 20px rgba(16, 52, 166, 0.3);
            }
        }

        @keyframes panGrid {
            0% {
                transform: perspective(1000px) rotateX(60deg) translateY(0) translateZ(-200px);
            }

            100% {
                transform: perspective(1000px) rotateX(60deg) translateY(100px) translateZ(-200px);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }

            100% {
                background-position: 1000px 0;
            }
        }

        /* Animation Utility Classes */
        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .animate-fade-in-down {
            animation: fadeInDown 0.8s ease-out forwards;
        }

        .animate-slide-in-left {
            animation: slideInLeft 0.8s ease-out forwards;
        }

        .animate-slide-in-right {
            animation: slideInRight 0.8s ease-out forwards;
        }

        .animate-scale-in {
            animation: scaleIn 0.6s ease-out forwards;
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        .animate-bounce-slow {
            animation: float 4s ease-in-out infinite;
        }

        .animate-glow {
            animation: glow 2s ease-in-out infinite;
        }

        .animate-fade-in {
            animation: fadeInUp 1s ease-out forwards;
        }

        /* Staggered animations */
        .stagger-1 {
            animation-delay: 0.1s;
        }

        .stagger-2 {
            animation-delay: 0.2s;
        }

        .stagger-3 {
            animation-delay: 0.3s;
        }

        .stagger-4 {
            animation-delay: 0.4s;
        }

        .stagger-5 {
            animation-delay: 0.5s;
        }

        .stagger-6 {
            animation-delay: 0.6s;
        }

        /* Smooth scroll reveals */
        .scroll-reveal {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .scroll-reveal.in-view {
            opacity: 1;
        }

        .brutalist-shadow {
            box-shadow: 8px 8px 0px 0px rgba(30, 58, 138, 1);
        }

        .brutalist-shadow-sm {
            box-shadow: 4px 4px 0px 0px rgba(30, 58, 138, 1);
        }

        .brutalist-shadow-hover:hover {
            box-shadow: 12px 12px 0px 0px rgba(30, 58, 138, 1);
            transform: translate(-4px, -4px);
        }

        .brutalist-card {
            border: 4px solid #1e3a8a;
            transition: all 0.2s ease;
        }
    </style>
